[project]
name = "synchronicity2"
version = "1.0"
description = "Export blocking and async library versions from a single async implementation"
readme = "README.md"
authors = [
    { name = "Modal Labs" }
]
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.6"]
classifiers = [
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
synchronicity2 = "synchronicity2.codegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 120
exclude = ['.venv', '.git', '__pycache__', 'build', 'dist']

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I']

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["pytest"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".*",
]

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pre-commit>=3.5.0",
    "pyright>=1.1.406",
    {include-group = "lint"},
    {include-group = "test"},
]
lint = [
    "mypy-extensions>=1.0.0",
    "mypy>=1.13.0",
    "ruff>=0.11.13",
]
test = [
    "console-ctrl>=0.1.0",
    "gevent>=24.2.1; python_version < '3.13'",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-markdown-docs>=0.7.1",
    "synchronicity>=0.10.2,<1",
]


[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.pyright]
extraPaths = ["generated", "test/support_files"]
